<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>❤️ 小周周 ❤️</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
    background: #0a0a0f;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    cursor: pointer;
  }

  canvas { display: block; position: fixed; top: 0; left: 0; z-index: 1; }

  /* 文字层 */
  .text-layer {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    pointer-events: none;
    z-index: 10;
  }

  .name {
    font-size: clamp(36px, 8vw, 56px);
    font-weight: 900;
    letter-spacing: 0.25em;
    background: linear-gradient(135deg, #ff6b9d, #ff8a65, #ffd54f, #ff6b9d);
    background-size: 400% 400%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: nameGlow 3s ease-in-out infinite;
    filter: drop-shadow(0 0 25px rgba(255, 107, 157, 0.6))
            drop-shadow(0 0 50px rgba(255, 138, 101, 0.3));
    opacity: 0;
    transform: translateY(30px);
    animation: nameGlow 3s ease-in-out infinite, fadeSlideIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
  }

  @keyframes nameGlow {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  @keyframes fadeSlideIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .subtitle {
    font-size: clamp(14px, 3vw, 18px);
    color: rgba(255, 255, 255, 0.65);
    letter-spacing: 0.4em;
    margin-top: 14px;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeSlideIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.7s forwards;
  }

  .hint {
    position: fixed;
    bottom: 40px;
    width: 100%;
    text-align: center;
    color: rgba(255, 255, 255, 0.35);
    font-size: 12px;
    letter-spacing: 0.3em;
    z-index: 10;
    pointer-events: none;
    opacity: 0;
    animation: fadeSlideIn 1.2s ease 1.4s forwards;
  }

  /* 加载动画 */
  .loading {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    z-index: 100; pointer-events: none;
    transition: opacity 0.6s ease;
  }
  .loading.done { opacity: 0; }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div class="text-layer">
  <span class="name">小 周 周</span>
  <span class="subtitle">✨ 你是我宇宙里最亮的那颗星 ✨</span>
</div>

<div class="hint">💗 轻触屏幕 · 绽放爱意 💗</div>

<script>
// ============================================================
//  PRO 版爱心粒子特效 — 小周周专属
// ============================================================

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, cx, cy;
let mouseX = -999, mouseY = -999;
let mouseDown = false;

// ----  resize ----
function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2; cy = H / 2;
}
window.addEventListener('resize', resize);
resize();

// ----  helpers ----
const PI = Math.PI, TAU = PI * 2;
function rand(min, max)       { return min + Math.random() * (max - min); }
function randInt(min, max)    { return Math.floor(rand(min, max + 1)); }
function lerp(a, b, t)        { return a + (b - a) * t; }
function dist(x1,y1,x2,y2)    { const dx=x2-x1,dy=y2-y1; return Math.sqrt(dx*dx+dy*dy); }
function hsl(h,s,l,a=1)       { return `hsla(${h},${s}%,${l}%,${a})`; }

// ============================================================
//  粒子类
// ============================================================
class Particle {
  constructor(x, y, opts = {}) {
    this.x  = x;
    this.y  = y;
    this.vx = opts.vx ?? rand(-0.5, 0.5);
    this.vy = opts.vy ?? rand(-0.5, 0.5);
    this.r  = opts.r  ?? rand(1.2, 3.5);
    this.h  = opts.h  ?? rand(0, 20);   // hue offset
    this.life      = opts.life      ?? rand(2, 6);
    this.maxLife   = this.life;
    this.fadeMode  = opts.fadeMode  ?? 'smooth';  // smooth | late
    this.type      = opts.type      ?? 'circle';   // circle | spark
    this.gravity   = opts.gravity   ?? 0;
    this.friction  = opts.friction  ?? 0.99;
  }

  update(dt) {
    this.vx *= this.friction;
    this.vy *= this.friction;
    this.vy += this.gravity * dt;
    this.x += this.vx * dt * 60;
    this.y += this.vy * dt * 60;
    this.life -= dt;
  }

  alive() { return this.life > 0; }

  alpha() {
    const t = this.life / this.maxLife;
    if (this.fadeMode === 'late') return Math.min(1, t * 3);
    return t;  // smooth linear
  }

  draw(ctx) {
    const a = this.alpha();
    if (a <= 0) return;
    const hue = (this.h + (1 - a) * 30) % 360;
    const glow = this.r * (1 + a * 2);
    ctx.save();
    ctx.globalAlpha = a;
    // outer glow
    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, glow);
    grad.addColorStop(0, hsl(hue, 90, 65, a));
    grad.addColorStop(0.4, hsl(hue, 85, 55, a * 0.6));
    grad.addColorStop(1, hsl(hue, 80, 40, 0));
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, glow, 0, TAU);
    ctx.fill();
    // bright core
    ctx.fillStyle = hsl(hue, 60, 85, a);
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r * 0.6, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
}

// ============================================================
//  粒子系统
// ============================================================
const particles = [];

function spawnBurst(x, y, count, opts = {}) {
  const {
    hue = rand(340, 30),
    hueVar = 30,
    speed = 3,
    life = 3,
    r = 2.5,
  } = opts;
  for (let i = 0; i < count; i++) {
    const angle = rand(0, TAU);
    const spd   = rand(speed * 0.3, speed);
    const p = new Particle(x, y, {
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      r:  rand(r * 0.5, r * 1.5),
      h:  hue + rand(-hueVar, hueVar),
      life: rand(life * 0.5, life * 1.5),
      fadeMode: 'late',
      friction: rand(0.94, 0.98),
      gravity: rand(0.01, 0.04),
    });
    particles.push(p);
  }
}

// ---- 爱心轮廓上的点 ----
function heartPoint(t, scale = 1) {
  // 爱心参数方程 (心形线变体)
  const tt = t * TAU;
  const x = 16 * Math.pow(Math.sin(tt), 3);
  const y = 13 * Math.cos(tt) - 5 * Math.cos(2*tt) - 2 * Math.cos(3*tt) - Math.cos(4*tt);
  return { x: x * scale, y: -y * scale };
}

// ---- 在爱心轮廓上生成粒子 ----
function spawnHeartOutline(centerX, centerY, scale, count, opts = {}) {
  const {
    hue = 350,
    hueVar = 25,
    life = 4,
    jitter = 2,
  } = opts;
  for (let i = 0; i < count; i++) {
    const t = i / count;
    const pt = heartPoint(t, scale);
    const x = centerX + pt.x + rand(-jitter, jitter);
    const y = centerY + pt.y + rand(-jitter, jitter);
    const p = new Particle(x, y, {
      vx: rand(-0.3, 0.3),
      vy: rand(-0.3, 0.3),
      r:  rand(1, 3),
      h:  hue + rand(-hueVar, hueVar),
      life: rand(life * 0.5, life * 1.5),
      fadeMode: 'smooth',
      friction: 0.98,
    });
    particles.push(p);
  }
}

// ---- 持续在爱心上生成粒子（呼吸感） ----
function spawnHeartPulse() {
  if (particles.length < 280) {
    spawnHeartOutline(cx, cy - 15, 9, 30, { hue: 350, hueVar: 20, life: 3.5, jitter: 3 });
    spawnHeartOutline(cx, cy - 15, 8.5, 20, { hue: 10, hueVar: 15, life: 3, jitter: 2.5 });
  }
}

// ============================================================
//  流星
// ============================================================
const shootingStars = [];

function spawnShootingStar() {
  shootingStars.push({
    x: rand(W * 0.1, W * 0.9),
    y: rand(-20, H * 0.3),
    vx: rand(2, 5),
    vy: rand(1.5, 3.5),
    life: rand(1.5, 3),
    maxLife: 0,
    trail: [],
  });
  shootingStars[shootingStars.length-1].maxLife = shootingStars[shootingStars.length-1].life;
}

// ============================================================
//  主循环
// ============================================================
let lastTime = performance.now();
let heartPulseTimer = 0;
let starTimer = 0;
let autoClickTimer = 0;

function update(dt) {
  // 限帧 dt
  const capped = Math.min(dt, 0.1);

  // 更新粒子
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update(capped);
    if (!particles[i].alive()) particles.splice(i, 1);
  }

  // 爱心持续呼吸粒子
  heartPulseTimer += capped;
  if (heartPulseTimer > 0.08) {
    heartPulseTimer = 0;
    spawnHeartPulse();
  }

  // 流星
  starTimer += capped;
  if (starTimer > rand(3, 8)) {
    starTimer = 0;
    if (shootingStars.length < 3) spawnShootingStar();
  }

  for (let i = shootingStars.length - 1; i >= 0; i--) {
    const s = shootingStars[i];
    s.x += s.vx * capped * 60;
    s.y += s.vy * capped * 60;
    s.life -= capped;
    s.trail.push({ x: s.x, y: s.y, life: 0.5 });
    for (let j = s.trail.length - 1; j >= 0; j--) {
      s.trail[j].life -= capped;
      if (s.trail[j].life <= 0) s.trail.splice(j, 1);
    }
    if (s.life <= 0 || s.x > W + 50 || s.y > H + 50) shootingStars.splice(i, 1);
  }

  // 自动触发（仅首次3秒后）
  autoClickTimer += capped;
  if (autoClickTimer > 3 && autoClickTimer < 3.1 && mouseX === -999) {
    spawnBurst(cx, cy - 10, 60, { hue: 350, hueVar: 40, speed: 3.5, life: 3 });
  }
}

// ---- 渲染 ----
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return [r,g,b];
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // ---- 深邃背景 ----
  const bgGrad = ctx.createRadialGradient(cx, cy * 0.8, 0, cx, cy, Math.max(W, H) * 0.8);
  bgGrad.addColorStop(0, '#1a1025');
  bgGrad.addColorStop(0.4, '#0f0c1a');
  bgGrad.addColorStop(0.8, '#080712');
  bgGrad.addColorStop(1, '#04040c');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // ---- 光晕（爱心周围） ----
  const auraGrad = ctx.createRadialGradient(cx, cy - 15, 30, cx, cy - 15, 280);
  auraGrad.addColorStop(0, 'rgba(255, 80, 120, 0.12)');
  auraGrad.addColorStop(0.5, 'rgba(255, 60, 100, 0.04)');
  auraGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = auraGrad;
  ctx.fillRect(0, 0, W, H);

  // ---- 流星 ----
  for (const s of shootingStars) {
    const a = Math.min(1, s.life / s.maxLife);
    // trail
    if (s.trail.length > 1) {
      ctx.beginPath();
      ctx.moveTo(s.trail[0].x, s.trail[0].y);
      for (let i = 1; i < s.trail.length; i++) {
        ctx.lineTo(s.trail[i].x, s.trail[i].y);
      }
      ctx.lineTo(s.x, s.y);
      ctx.strokeStyle = `rgba(255,255,255,${a * 0.6})`;
      ctx.lineWidth = 1.5;
      ctx.lineCap = 'round';
      ctx.stroke();
    }
    // head glow
    const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, 15);
    g.addColorStop(0, `rgba(255,255,255,${a})`);
    g.addColorStop(0.3, `rgba(200,220,255,${a * 0.6})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(s.x, s.y, 15, 0, TAU); ctx.fill();
  }

  // ---- 爱心轮廓光环（静态） ----
  ctx.save();
  ctx.globalAlpha = 0.15 + Math.sin(performance.now() * 0.003) * 0.05;
  const outlineGlow = ctx.createRadialGradient(cx, cy - 15, 80, cx, cy - 15, 200);
  outlineGlow.addColorStop(0, 'rgba(255, 100, 140, 0.08)');
  outlineGlow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = outlineGlow;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  // ---- 粒子 ----
  for (const p of particles) p.draw(ctx);

  // ---- 鼠标光晕 ----
  if (mouseX > -900 && !mouseDown) {
    const mg = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 60);
    mg.addColorStop(0, 'rgba(255, 200, 220, 0.15)');
    mg.addColorStop(0.5, 'rgba(255, 150, 180, 0.05)');
    mg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = mg;
    ctx.beginPath(); ctx.arc(mouseX, mouseY, 60, 0, TAU); ctx.fill();
  }
}

function loop(time) {
  const dt = Math.min(0.1, (time - lastTime) / 1000);
  lastTime = time;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

// ============================================================
//  交互事件
// ============================================================
function onInteract(x, y) {
  // 大爆发
  spawnBurst(x, y, 45, { hue: rand(340, 25), hueVar: 35, speed: 4, life: 3.5, r: 3 });
  // 金色小粒子
  spawnBurst(x, y, 25, { hue: rand(30, 60), hueVar: 15, speed: 2.5, life: 2.5, r: 2 });
  // 白色火花
  spawnBurst(x, y, 15, { hue: 0, hueVar: 5, speed: 3.5, life: 2, r: 1.8 });

  // 如果点在爱心附近，爱心粒子爆发
  const heartDist = dist(x, y, cx, cy - 15);
  if (heartDist < 200) {
    const count = Math.floor((1 - heartDist / 200) * 50) + 10;
    spawnHeartOutline(cx, cy - 15, 9, count, { hue: 350, hueVar: 30, life: 4, jitter: 5 });
  }
}

canvas.addEventListener('click', e => {
  onInteract(e.clientX, e.clientY);
});

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.touches) onInteract(t.clientX, t.clientY);
}, { passive: false });

canvas.addEventListener('mousemove', e => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  // 移动时偶尔留下粒子尾迹
  if (Math.random() < 0.3 && particles.length < 400) {
    const p = new Particle(mouseX, mouseY, {
      vx: rand(-0.5, 0.5), vy: rand(-0.5, 0.5),
      r: rand(0.8, 2), h: rand(340, 20),
      life: rand(1, 2.5), fadeMode: 'late',
      friction: 0.96, gravity: 0.02,
    });
    particles.push(p);
  }
});

canvas.addEventListener('mouseleave', () => { mouseX = -999; mouseY = -999; });

// ============================================================
//  初始绽放
// ============================================================
setTimeout(() => {
  spawnBurst(cx, cy - 10, 80, { hue: 350, hueVar: 40, speed: 5, life: 4, r: 3 });
  setTimeout(() => spawnBurst(cx - 50, cy - 30, 40, { hue: 10, hueVar: 30, speed: 3.5, life: 3 }), 200);
  setTimeout(() => spawnBurst(cx + 50, cy - 30, 40, { hue: 340, hueVar: 30, speed: 3.5, life: 3 }), 400);
}, 400);

// 持续爱心呼吸
spawnHeartOutline(cx, cy - 15, 9, 120, { hue: 350, hueVar: 20, life: 6, jitter: 1 });

// ============================================================
//  START
// ============================================================
requestAnimationFrame(loop);

console.log('💖 小周周 · 专属星空已就绪 💖');
console.log('✨ 点击屏幕 · 绽放爱意 ✨');
</script>
</body>
</html>
